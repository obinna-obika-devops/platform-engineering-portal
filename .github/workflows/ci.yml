name: platform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q portal tests

      - name: Validate catalog structure
        run: python -c "from portal.catalog import load_catalog; c=load_catalog(); assert c and all(v['environments'] for v in c.values())"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate developer CLI
        run: python -m portal.cli orders python dev | grep -q 'gitops-registration'
